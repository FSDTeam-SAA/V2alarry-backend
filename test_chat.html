<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2alarry Chat Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  
  .top-bar { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 12px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .top-bar label { font-size: 12px; color: #888; }
  .top-bar input { background: #2a2a2a; border: 1px solid #3a3a3a; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .top-bar input.token-input { width: 320px; }
  .top-bar input.conv-input { width: 280px; }
  .top-bar .toggle { display: flex; align-items: center; gap: 6px; }
  .top-bar .toggle input[type="checkbox"] { accent-color: #6c5ce7; }
  .top-bar .status { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #2a2a2a; }
  .top-bar .status.ok { background: #1a3a1a; color: #4caf50; }
  .top-bar .status.err { background: #3a1a1a; color: #f44336; }
  .top-bar button { background: #6c5ce7; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .top-bar button:hover { background: #5a4bd6; }

  .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #6c5ce7; color: white; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1e1e1e; border: 1px solid #2a2a2a; border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: none; color: #666; font-size: 12px; font-style: italic; }
  .msg .meta { font-size: 11px; color: #666; margin-top: 6px; }

  .typing { align-self: flex-start; padding: 12px 16px; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 12px; display: none; }
  .typing span { display: inline-block; width: 6px; height: 6px; background: #6c5ce7; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  .input-bar { background: #1a1a1a; border-top: 1px solid #2a2a2a; padding: 16px 20px; display: flex; gap: 10px; }
  .input-bar textarea { flex: 1; background: #2a2a2a; border: 1px solid #3a3a3a; color: #e0e0e0; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-family: inherit; resize: none; min-height: 44px; max-height: 120px; outline: none; }
  .input-bar textarea:focus { border-color: #6c5ce7; }
  .input-bar button { background: #6c5ce7; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .input-bar button:hover { background: #5a4bd6; }
  .input-bar button:disabled { background: #3a3a3a; cursor: not-allowed; }
</style>
</head>
<body>

<div class="top-bar">
  <label>Base URL</label>
  <input id="baseUrl" value="http://localhost:8000" style="width:200px">
  <label>Token</label>
  <input id="token" class="token-input" type="password" placeholder="JWT token">
  <label>Conversation ID</label>
  <input id="convId" class="conv-input" placeholder="leave empty for new conversation">
  <div class="toggle">
    <input type="checkbox" id="streamToggle" checked>
    <label for="streamToggle">Stream</label>
  </div>
  <button onclick="sendTestPing()">Ping Server</button>
  <span id="status" class="status">Not connected</span>
</div>

<div class="chat-container" id="chat">
  <div class="msg system">Enter your token and start chatting. Streaming is enabled by default.</div>
</div>

<div class="typing" id="typing"><span></span><span></span><span></span></div>

<div class="input-bar">
  <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
  <button id="sendBtn" onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typing = document.getElementById('typing');
const status = document.getElementById('status');

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function addMsg(role, text, meta) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function setStatus(msg, type) {
  status.textContent = msg;
  status.className = `status ${type || ''}`;
}

async function sendTestPing() {
  try {
    const res = await fetch(document.getElementById('baseUrl').value + '/', { signal: AbortSignal.timeout(5000) });
    const data = await res.json();
    setStatus('Connected', 'ok');
    addMsg('system', `Server: ${data.message} v${data.version}`);
  } catch (e) {
    setStatus('Connection failed', 'err');
    addMsg('system', `Error: ${e.message}`);
  }
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  const token = document.getElementById('token').value.trim();
  const baseUrl = document.getElementById('baseUrl').value.trim();
  const convId = document.getElementById('convId').value.trim() || null;
  const stream = document.getElementById('streamToggle').checked;

  if (!token) { addMsg('system', 'Enter your JWT token first.'); return; }

  addMsg('user', text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  typing.style.display = 'block';
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch(`${baseUrl}/api/v1/chat/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ message: text, conversation_id: convId, stream })
    });

    if (!res.ok) {
      const err = await res.json();
      addMsg('system', `Error ${res.status}: ${err.detail || JSON.stringify(err)}`);
      setStatus(`HTTP ${res.status}`, 'err');
      return;
    }

    setStatus('Connected', 'ok');

    if (stream) {
      await handleStream(res, convId);
    } else {
      const data = await res.json();
      addMsg('assistant', data.response, `conv: ${data.conversation_id}`);
      document.getElementById('convId').value = data.conversation_id;
    }
  } catch (e) {
    addMsg('system', `Error: ${e.message}`);
    setStatus('Request failed', 'err');
  } finally {
    sendBtn.disabled = false;
    typing.style.display = 'none';
  }
}

async function handleStream(res, currentConvId) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let assistantDiv = null;
  let fullText = '';
  let finalMeta = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    const chunk = decoder.decode(value);
    const lines = chunk.split('\n');

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const payload = line.slice(6);
      if (payload === '[DONE]') continue;

      try {
        const event = JSON.parse(payload);

        if (event.type === 'token') {
          if (!assistantDiv) {
            assistantDiv = addMsg('assistant', '');
            assistantDiv.style.whiteSpace = 'pre-wrap';
          }
          fullText += event.content;
          assistantDiv.textContent = fullText;
          chat.scrollTop = chat.scrollHeight;
        }

        if (event.type === 'done') {
          document.getElementById('convId').value = event.conversation_id || currentConvId;
          finalMeta = `conv: ${event.conversation_id || currentConvId}`;
        }
      } catch (e) {}
    }
  }

  if (assistantDiv && finalMeta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = finalMeta;
    assistantDiv.appendChild(m);
  }
}
</script>
</body>
</html>
